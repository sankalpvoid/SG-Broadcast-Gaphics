<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shailesh Gour Broadcast Graphics — Social Ticker</title>
  <link rel="stylesheet" href="./styles.css?v=single-state-20261009">
</head>
<body>
  <main class="stage" aria-label="Shailesh Gour live ticker">
    <div class="ticker" aria-label="Social ticker">
      <div class="brand">
        <span class="brand-mark-frame" aria-hidden="true"><img class="brand-mark-image" src="https://raw.githubusercontent.com/sankalpvoid/SG-Broadcast-Gaphics/main/Gemini_Generated_Image_42tiny42tiny42ti%20(1).png" alt=""></span>
        <div class="brand-copy">
          <span class="brand-name">Shailesh Gour</span>
          <span class="brand-subtitle"><span>MARKET INTELLIGENCE</span><span>&amp; ANALYSIS</span></span>
        </div>
      </div>

      <div class="ticker-body">
        <div class="social-bar" id="socialBar" aria-label="Social channels and disclaimer"></div>
      </div>

      <div class="live">
        <span class="live-dot" aria-hidden="true"></span>
        LIVE
      </div>

      <div class="clock" id="clock">00:00 IST</div>
    </div>
  </main>
  <script src="./app.js?v=single-state-20261009"></script>
</body>
</html>
