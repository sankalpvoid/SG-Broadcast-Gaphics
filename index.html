<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shailesh Gour Broadcast Graphics — Live Ticker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="stage" aria-label="Shailesh Gour live ticker">
    <div class="ticker" role="status" aria-live="polite">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">SG</div>
        <div class="brand-copy">
          <span class="brand-name">SHAILESH GOUR</span>
          <span class="brand-subtitle">MARKET INTELLIGENCE &amp; ANALYSIS</span>
        </div>
      </div>

      <div class="ticker-body">
        <div class="market-window">
          <div class="ticker-track" id="tickerTrack"></div>
        </div>
        <div class="social-bar" id="socialBar" aria-label="Social channels and disclaimer"></div>
      </div>

      <div class="live">
        <span class="live-dot" aria-hidden="true"></span>
        LIVE
      </div>

      <div class="clock" id="clock">00:00 IST</div>
    </div>
  </main>
  <script src="./app.js"></script>
</body>
</html>
